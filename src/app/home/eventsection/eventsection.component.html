<section class="news" aria-labelledby="news-heading">
  <div class="news__head">
    <h2 id="news-heading">News and events</h2>
    <a class="news__all" routerLink="/events/latest">All events</a>
  </div>

  @if (eventCategories$ | async; as categories) {
    @if (eventImages$ | async; as images) {
      <ul class="news__grid">
        @for (category of categories; track category.id; let i = $index) {
          <li>
            <a class="story" [routerLink]="category.route">
              <span class="story__frame">
                <img [src]="images[i].url || 'assets/events/placeholder.jpg'" [alt]="images[i].alt || category.title"
                     loading="lazy" decoding="async">
                <span class="story__tag">{{ category.badge }}</span>
              </span>
              <span class="story__title">{{ category.title }}</span>
              <span class="story__text">{{ category.description }}</span>
            </a>
          </li>
        }
      </ul>
    }
  }
</section>
