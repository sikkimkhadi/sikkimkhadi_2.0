<div class="home-container">
    <!-- Conditionally render carousel based on screen size -->
    @if (isLargeScreen | async) {
        <!-- Desktop/Tablet carousel -->
        <app-desk-cl />
    } @else {
        <!-- Mobile carousel -->
        <app-mob-cl />
    }
    <div class="sk-page">
        <span class="sk-weave" aria-hidden="true"></span>
        <app-portraits />
        <app-about />
        <app-services />
        <app-homegallery />
        <app-eventsection />
    </div>
</div>
