<section class="gallery" aria-labelledby="gallery-heading">
  <div class="gallery__head">
    <h2 id="gallery-heading">From our looms, centres and outlets</h2>
    <div class="gallery__filters" role="group" aria-label="Show photos of">
      @for (f of filters; track f.id) {
        <button type="button" class="chip" [class.chip--on]="active() === f.id"
                [attr.aria-pressed]="active() === f.id" (click)="select(f.id)">
          {{ f.label }} <span class="chip__count">{{ f.count }}</span>
        </button>
      }
    </div>
  </div>

  <ul class="gallery__grid" id="gallery-grid">
    @for (item of shown(); track item.id; let i = $index) {
      <li>
        <a class="tile" [routerLink]="item.link">
          <span class="tile__frame">
            <img [src]="item.image" [alt]="item.alt" width="720" height="540"
                 [attr.loading]="i < 4 ? null : 'lazy'" decoding="async">
          </span>
          <span class="tile__title">{{ item.title }}</span>
          <span class="tile__kind" [attr.data-kind]="item.category">{{ categoryLabel(item.category) }}</span>
        </a>
      </li>
    }
  </ul>

  @if (filtered().length > initialCount) {
    <button type="button" class="gallery__more" aria-controls="gallery-grid" (click)="expanded.set(!expanded())">
      @if (expanded()) { Show fewer } @else { Show all {{ filtered().length }} photos }
    </button>
  }
</section>
